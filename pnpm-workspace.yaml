packages:
  - "apps/*"
  - "packages/*"

# Fail the install if the running Node.js does not satisfy a package's `engines`.
engineStrict: true

# One place for shared dependency versions; packages reference them as "catalog:".
catalog:
  "@types/node": 24.13.6
  "@vitest/coverage-v8": 5.0.2
  fast-check: 4.10.2
  typescript: 6.0.3
  vitest: 5.0.2
  zod: 4.6.5

# Lifecycle scripts are blocked unless listed here (supply-chain hardening).
allowBuilds:
  # Only verifies its prebuilt native binding, which pnpm installs from optionalDependencies.
  unrs-resolver: false
  # Its postinstall only checks the platform binary, which pnpm installs from optionalDependencies.
  esbuild: false

minimumReleaseAgeExclude:
  - "@vitest/coverage-v8@5.0.2"
  - "@vitest/mocker@5.0.2"
  - "@vitest/spy@5.0.2"
  - vitest@5.0.2
