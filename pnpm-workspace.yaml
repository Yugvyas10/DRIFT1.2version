packages:
  - "apps/*"
  - "packages/*"

# Fail the install if the running Node.js does not satisfy a package's `engines`.
engineStrict: true

# One place for shared dependency versions; packages reference them as "catalog:".
catalog:
  "@types/node": 24.13.6
  "@vitest/coverage-v8": 5.0.2
  fast-check: 4.10.2
  typescript: 6.0.3
  vitest: 5.0.2
  zod: 4.6.5

# Patched versions of transitive dependencies with open advisories (`pnpm audit` in CI). Remove an entry when
# the package that pulls it in ships the fix itself.
overrides:
  # Via prisma > @prisma/config (GHSA-ggr8-5vv4-36mx). Prisma only calls `deepmerge`, unchanged in 8.x.
  deepmerge-ts: 8.0.2
  # Via the prisma CLI (GHSA-3f6p-5ww8-9rcr and a zlib advisory). DRIFT uses Postgres and never loads it.
  mysql2: 3.24.5

# Lifecycle scripts are blocked unless listed here (supply-chain hardening).
allowBuilds:
  # Only verifies its prebuilt native binding, which pnpm installs from optionalDependencies.
  unrs-resolver: false
  # Its postinstall only checks the platform binary, which pnpm installs from optionalDependencies.
  esbuild: false
  # Prisma's postinstall scripts download nothing we need: the client is generated by `prisma generate` in the
  # db package's build, and Prisma 7 has no native query engine.
  prisma: false
  "@prisma/client": false
  "@prisma/engines": false
  # Dependencies of testcontainers (through the Docker client). Their scripts only build optional native
  # accelerators for SSH connections to remote Docker hosts, which the tests do not use.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # A dependency of bullmq (through msgpackr). Its script builds an optional native decoder; the JavaScript
  # one is used without it.
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - "@vitest/coverage-v8@5.0.2"
  - "@vitest/mocker@5.0.2"
  - "@vitest/spy@5.0.2"
  - vitest@5.0.2
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
  - "@aws-sdk/client-s3@3.1144.0"
  - "@aws-sdk/s3-request-presigner@3.1144.0"
