name: Benchmarks

# Runs the full evaluation (PLAN §6 M3/M8) on a GitHub-hosted runner, on demand: the pinned real-world fixtures,
# the performance benchmark (up to 1M lines of traffic) and the labelled-mutation benchmark. The results are
# uploaded as an artifact; commit docs/evaluation/*.json and docs/EVALUATION.md from it to publish them.
# It starts by hand, or when a pull request gets the label `run-benchmarks`: a manual run is only possible once
# this file is on the default branch, and the label lets a branch be measured before it is merged.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  bench:
    name: Fixtures, performance and mutations
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request, measure the branch's own commit rather than the temporary merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@drift/bench...
      - name: Run every benchmark
        run: pnpm --filter @drift/bench run all
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation
          path: |
            docs/evaluation/
            docs/EVALUATION.md
            packages/bench/results/
          if-no-files-found: warn
