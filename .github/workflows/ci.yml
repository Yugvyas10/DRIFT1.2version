name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # apps/web refuses to build or typecheck without a valid environment (fail-fast validation). These are
  # placeholders for the build: nothing connects to them. The integration and end-to-end jobs start their own
  # Postgres, Redis and S3 in containers and pass the real values to the app.
  APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://build:build@localhost:5432/build
  AUTH_SECRET: ci-build-placeholder-not-a-secret-0000000
  S3_ENDPOINT: http://localhost:8333
  S3_BUCKET: build
  S3_ACCESS_KEY_ID: build
  S3_SECRET_ACCESS_KEY: build
  REDIS_URL: redis://localhost:6379

jobs:
  check:
    name: Typecheck, lint, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck, lint, test with coverage thresholds, build
        run: pnpm turbo run typecheck lint test build
      - name: docs/EVALUATION.md matches the committed benchmark results
        run: pnpm --filter @drift/bench run evaluation:check
      - name: The committed Action bundle matches its source
        run: pnpm --filter @drift/github-action run bundle:check
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sh scripts/secret-scan.sh

  services:
    name: Local services and worker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # docker compose reads S3_* from the environment, so the workflow's build placeholders would configure the
    # object store; the local defaults are used for both the services and the worker instead.
    env:
      S3_BUCKET: drift-artifacts
      S3_ACCESS_KEY_ID: drift
      S3_SECRET_ACCESS_KEY: drift-local-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Postgres, Redis and object storage; wait until healthy
        run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@drift/worker
      - name: Worker reaches the database, Redis and object storage (--check) and exits 0
        run: pnpm --filter @drift/worker run check
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://drift:drift-local-only@localhost:5432/drift
          S3_ENDPOINT: http://localhost:8333
      - name: Service status
        if: always()
        run: docker compose -f infra/docker-compose.yml ps
      - name: Stop services
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  integration:
    name: Integration tests, ${{ matrix.package }} (Postgres, Redis, S3 in containers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [web, worker, platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@drift/${{ matrix.package }}^...
      # web: migrations apply and match the schema; the API follows drift-api.yaml; SSE; rate limits.
      # worker: server-side runs end to end, retries, a killed worker, timeouts, the DLQ, per-org limits, the trace.
      # platform: queue, run events, semaphore and storage against real Redis and S3.
      - name: Integration tests with coverage thresholds
        run: pnpm --filter @drift/${{ matrix.package }} run test:integration

  e2e:
    name: End-to-end (browser, drift compare --upload, drift run with the worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@drift/web --filter=@drift/cli --filter=@drift/worker
      - name: Install the browser
        run: pnpm --filter @drift/web exec playwright install --with-deps chromium
      - name: Register, create a key, upload a run, run one on the platform, follow it live, re-run it
        run: pnpm --filter @drift/web run test:e2e
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  fixtures:
    name: Real-world fixtures (ingest + self-diff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@drift/bench...
      - name: Download pinned fixtures (verified by SHA-256)
        run: pnpm --filter @drift/bench run fixtures:fetch
      - name: Every fixture ingests and diffs to zero changes against itself
        run: pnpm --filter @drift/bench run fixtures:check
      - name: Keep the machine-readable results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-check
          path: packages/bench/results/fixtures.json
          if-no-files-found: ignore

  dogfood:
    # DRIFT checks its own API contract on every pull request, with the Action from this commit (PLAN M4).
    name: DRIFT on its own API (dogfood)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # One PR comment. A pull request from a fork gets a read-only token: the Action then only warns.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Action fetches the base commit itself; this repository is public, so that needs no stored token.
          persist-credentials: false
      - name: DRIFT contract gate
        uses: ./packages/github-action
        with:
          spec: apps/web/openapi/drift-api.yaml
          policy: apps/web/openapi/drift-policy.yaml
