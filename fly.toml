# Fly.io configuration of the DRIFT platform (ADR-0008): one image (Dockerfile), two process groups, the migrations
# as the release command. First deploy and secrets: docs/modules/infra.md. Deploy: `fly deploy --remote-only`.
#
# The app name is global on Fly. If it is taken, change `app` and APP_URL together.
app = "drift-platform"
primary_region = "sin"
# On SIGTERM the worker stops taking jobs and finishes the runs in progress. A run still going after
# kill_timeout is killed; its job lock expires and the job is retried (SECURITY T34).
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/infra/fly/release.sh"

# Not secret. Secrets (fly secrets set): DATABASE_URL, REDIS_URL, AUTH_SECRET, S3_ENDPOINT, S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY, and GITHUB_ID/GITHUB_SECRET once there is an OAuth app.
[env]
  APP_URL = "https://drift-platform.fly.dev"
  LOG_LEVEL = "info"
  S3_REGION = "auto"
  S3_BUCKET = "drift-artifacts"

[processes]
  web = "/app/infra/fly/web.sh"
  worker = "/app/infra/fly/worker.sh"

[http_service]
  internal_port = 3000
  force_https = true
  processes = ["web"]
  # One web Machine always runs, so nobody waits for a cold start. The worker has no service, so the proxy
  # never stops it.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  # Liveness only. /readyz queries Postgres, and checking it every 30 s would keep Neon from scaling to zero.
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"

[[restart]]
  policy = "always"
  processes = ["worker"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["web", "worker"]
