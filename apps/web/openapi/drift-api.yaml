openapi: 3.1.0
info:
  title: DRIFT platform API
  version: 0.3.0
  summary: Ingestion and read API of the DRIFT platform.
  description: >-
    Written in M4, before the implementation, as the design of the ingestion API (PLAN §6 M4, spec-first), and
    extended in M5 with the management API. DRIFT's own CI runs DRIFT on this file for every pull request (the
    dogfood job). Contract tests check the real handlers' requests and responses against it with the engine's
    own validators (apps/web/src/server/api/*.int.test.ts).


    Status: implemented (M5: accounts, organisations, keys, uploaded runs; M6: server-side runs, re-runs and
    live events). Every route checks an API key or a session and is scoped to one organisation; resources of
    other organisations answer 404. Authenticated calls are rate limited per key or user (429 with Retry-After).


    Version 0.3.0 changes responses in ways that are not backward compatible (a run has the new states
    `queued` and `running`, and its result is absent until it finishes). The API is unreleased and has no
    clients yet; the change is accepted, with a reason and an expiry, in apps/web/openapi/drift-policy.yaml.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000
    description: Local development (docker compose)
security:
  - apiKey: []
  - session: []
tags:
  - name: accounts
    description: Registration. Sign-in itself is the web app's session flow, not part of this API.
  - name: organisations
    description: Organisations, their projects, members, API keys and audit log.
  - name: runs
    description: Upload and read comparison runs.
  - name: health
    description: Liveness and readiness.

paths:
  /api/v1/runs:
    post:
      tags: [runs]
      operationId: createRun
      summary: Create a run from a drift-report/v1 report
      description: >-
        Idempotent: repeating the request with the same `Idempotency-Key` and the same body returns the same run
        (200). The report is validated against drift-report/v1. Each announced artifact gets a short-lived
        pre-signed PUT URL; call `complete` once they are uploaded.
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreate"
      responses:
        "201":
          description: Run created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "200":
          description: The same request was made before with this idempotency key; the original run is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The idempotency key was already used with a different body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The body is larger than the limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The report is not a valid drift-report/v1 document.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: getRun
      summary: Read a run
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/runs/{runId}/complete:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runs]
      operationId: completeRun
      summary: Mark the uploads of a run as done
      description: >-
        The server checks that every announced artifact exists with its SHA-256. An uploaded report's run is then
        `complete`; a server-side run is `queued` for the worker.
      security:
        - apiKey: []
      responses:
        "200":
          description: The run, now complete (an uploaded report) or queued (a server-side run).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An announced artifact is missing or does not match its SHA-256.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/runs/{runId}/rerun:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runs]
      operationId: rerun
      summary: Re-run a server-side run with new traffic, policy, fail-on or seed
      description: >-
        Creates a child run (`parentRunId`). The contracts are the same files, so stages whose inputs did not
        change are cache hits. New traffic, if any, is uploaded like a run's inputs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerunCreate"
      responses:
        "201":
          description: The child run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The body is larger than the limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/runs/{runId}/stages:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: listStages
      summary: The run's stages, in pipeline order, each as of its latest attempt
      responses:
        "200":
          description: Stages.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [stages]
                properties:
                  stages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Stage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: runEvents
      summary: The run's events, live, as Server-Sent Events
      description: >-
        Replays the run's history, then streams new events until the run ends. Each event has an `id`; reconnect
        with `Last-Event-ID` to receive only the events after it (browsers' EventSource does this by itself).
        Event types: run.queued, run.started, stage.started, stage.finished, run.completed, run.failed.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            pattern: "^[0-9]{1,15}-[0-9]{1,10}$"
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/runs/{runId}/artifacts/{kind}:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - name: kind
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ArtifactKind"
    get:
      tags: [runs]
      operationId: getArtifactUrl
      summary: A short-lived signed URL to read one artifact of a run
      responses:
        "200":
          description: The signed URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project}/runs:
    parameters:
      - name: project
        in: path
        required: true
        description: The project's slug within the caller's organisation.
        schema:
          $ref: "#/components/schemas/Slug"
    post:
      tags: [runs]
      operationId: createServerRun
      summary: Create a server-side run from two contracts (and optionally recorded traffic)
      description: >-
        The platform's worker compares the contracts. Upload each announced file to its pre-signed URL, then call
        `complete`, which queues the run. When every file is already in the organisation's storage, the run is
        queued at once. Follow it with `GET /api/v1/runs/{runId}/events`. Contracts must be single files.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: org
          in: query
          required: false
          description: For a signed-in user in several organisations, the organisation's slug.
          schema:
            $ref: "#/components/schemas/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerRunCreate"
      responses:
        "201":
          description: Run created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "200":
          description: The same request was made before with this idempotency key; the original run is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The body is larger than the limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [runs]
      operationId: listRuns
      summary: List a project's runs, newest first
      parameters:
        - name: org
          in: query
          required: false
          description: >-
            For a signed-in user: the organisation's slug (may be left out when they belong to exactly one). An API
            key brings its organisation.
          schema:
            $ref: "#/components/schemas/Slug"
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          description: Only runs in this status.
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: gate
          in: query
          required: false
          description: Only finished runs whose gate passed, or failed.
          schema:
            type: string
            enum: [passed, failed]
        - name: mode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunMode"
        - name: branch
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/register:
    post:
      tags: [accounts]
      operationId: register
      summary: Create an account with an email address and a password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/orgs:
    get:
      tags: [organisations]
      operationId: listOrgs
      summary: The organisations the signed-in user belongs to
      security:
        - session: []
      responses:
        "200":
          description: Organisations, with the caller's role in each.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [orgs]
                properties:
                  orgs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Org"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [organisations]
      operationId: createOrg
      summary: Create an organisation; the caller becomes its owner
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgCreate"
      responses:
        "201":
          description: The organisation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [org]
                properties:
                  org:
                    $ref: "#/components/schemas/Org"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{org}/projects:
    parameters:
      - $ref: "#/components/parameters/Org"
    get:
      tags: [organisations]
      operationId: listProjects
      summary: The organisation's projects
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [organisations]
      operationId: createProject
      summary: Create a project (ADMIN or OWNER)
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: The project.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{org}/keys:
    parameters:
      - $ref: "#/components/parameters/Org"
    get:
      tags: [organisations]
      operationId: listKeys
      summary: The organisation's API keys (never the keys themselves)
      security:
        - session: []
      responses:
        "200":
          description: API keys.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [organisations]
      operationId: createKey
      summary: Create an API key (ADMIN or OWNER); the key is in this response and never shown again
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyCreate"
      responses:
        "201":
          description: The key, once, and its record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/Org"
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          pattern: "^key_[0-9a-z]{24}$"
    delete:
      tags: [organisations]
      operationId: revokeKey
      summary: Revoke an API key; it gets 401 from now on
      security:
        - session: []
      responses:
        "204":
          description: Revoked (also when it already was).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/members:
    parameters:
      - $ref: "#/components/parameters/Org"
    get:
      tags: [organisations]
      operationId: listMembers
      summary: The organisation's members
      security:
        - session: []
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/Org"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          pattern: "^usr_[0-9a-z]{24}$"
    patch:
      tags: [organisations]
      operationId: changeRole
      summary: Change a member's role (ADMIN or OWNER; only owners deal with owners)
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: The member, with the new role.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [member]
                properties:
                  member:
                    $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [organisations]
      operationId: removeMember
      summary: Remove a member, or leave the organisation
      security:
        - session: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{org}/invitations:
    parameters:
      - $ref: "#/components/parameters/Org"
    post:
      tags: [organisations]
      operationId: invite
      summary: Invite an email address; the token is in this response and never shown again
      description: DRIFT does not send email yet, so the inviter passes the token on.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: The invitation and its token.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, invitation]
                properties:
                  token:
                    type: string
                  invitation:
                    $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/invitations/accept:
    post:
      tags: [organisations]
      operationId: acceptInvitation
      summary: Join an organisation with an invitation token (for the signed-in user's email address)
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [org, role]
                properties:
                  org:
                    $ref: "#/components/schemas/Slug"
                  role:
                    $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{org}/projects/{project}/suppressions:
    parameters:
      - $ref: "#/components/parameters/Org"
      - name: project
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Slug"
    get:
      tags: [organisations]
      operationId: listSuppressions
      summary: A project's suppressions
      security:
        - session: []
      responses:
        "200":
          description: Suppressions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [suppressions]
                properties:
                  suppressions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Suppression"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [organisations]
      operationId: createSuppression
      summary: Accept one change until a date, with a reason (MEMBER or above)
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuppressionCreate"
      responses:
        "201":
          description: The suppression.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [suppression]
                properties:
                  suppression:
                    $ref: "#/components/schemas/Suppression"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{org}/audit:
    parameters:
      - $ref: "#/components/parameters/Org"
    get:
      tags: [organisations]
      operationId: listAudit
      summary: The organisation's audit log, newest first (ADMIN or OWNER)
      security:
        - session: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /healthz:
    get:
      tags: [health]
      operationId: liveness
      summary: Liveness
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      tags: [health]
      operationId: readiness
      summary: Readiness (database, Redis and object storage reachable)
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency is not reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: drift_…
      description: An organisation API key (prefix `drift_`), scoped to projects and permissions.
    session:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: A signed-in user's session (the web app).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chosen by the client, e.g. repository + pull request + head commit + spec hashes.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: "^[A-Za-z0-9._:/-]+$"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RunId"
    Org:
      name: org
      in: path
      required: true
      description: The organisation's slug.
      schema:
        $ref: "#/components/schemas/Slug"

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid API key or session.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The key or user may not do this.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found in the caller's organisation (also returned for other organisations' resources).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The caller's rate limit is used up; `Retry-After` says when to try again.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body is not application/json.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state (for example a slug that is taken).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    RunId:
      type: string
      pattern: "^run_[0-9a-z]{20,32}$"
    Slug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    Sha:
      type: string
      pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"

    Role:
      type: string
      enum: [OWNER, ADMIN, MEMBER, VIEWER]
    Timestamp:
      type: string
      format: date-time

    Register:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 72
        name:
          type: string
          minLength: 1
          maxLength: 100
    User:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          pattern: "^usr_[0-9a-z]{24}$"
        email:
          type: string
          format: email
        name:
          type: string

    OrgCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          $ref: "#/components/schemas/Slug"
    Org:
      type: object
      additionalProperties: false
      required: [id, slug, name, role]
      properties:
        id:
          type: string
          pattern: "^org_[0-9a-z]{24}$"
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          $ref: "#/components/schemas/Slug"
        repo:
          type: string
          description: The bound GitHub repository, as owner/name.
          pattern: "^[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}$"
        specPath:
          type: string
          minLength: 1
          maxLength: 500
    Project:
      type: object
      additionalProperties: false
      required: [id, slug, name, createdAt]
      properties:
        id:
          type: string
          pattern: "^prj_[0-9a-z]{24}$"
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        repo:
          type: string
        specPath:
          type: string
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    KeyPermission:
      type: string
      enum: [runs:read, runs:write]
    KeyCreate:
      type: object
      additionalProperties: false
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        project:
          description: Limits the key to one project; without it the key is valid for the whole organisation.
          $ref: "#/components/schemas/Slug"
        permissions:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/KeyPermission"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    ApiKey:
      type: object
      additionalProperties: false
      required: [id, name, prefix, permissions, createdAt]
      properties:
        id:
          type: string
          pattern: "^key_[0-9a-z]{24}$"
        name:
          type: string
        prefix:
          description: The first characters of the key, to recognise it. Not a secret.
          type: string
          pattern: "^drift_[A-Za-z0-9_-]{8}$"
        project:
          $ref: "#/components/schemas/Slug"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/KeyPermission"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          $ref: "#/components/schemas/Timestamp"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        revokedAt:
          $ref: "#/components/schemas/Timestamp"
    ApiKeyCreated:
      type: object
      additionalProperties: false
      required: [key, apiKey]
      properties:
        key:
          description: The API key. Shown in this response only; DRIFT stores its SHA-256.
          type: string
          pattern: "^drift_[A-Za-z0-9_-]{43}$"
        apiKey:
          $ref: "#/components/schemas/ApiKey"

    Member:
      type: object
      additionalProperties: false
      required: [userId, email, role, joinedAt]
      properties:
        userId:
          type: string
          pattern: "^usr_[0-9a-z]{24}$"
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          $ref: "#/components/schemas/Timestamp"
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, expiresAt]
      properties:
        id:
          type: string
          pattern: "^inv_[0-9a-z]{24}$"
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"

    SuppressionCreate:
      type: object
      additionalProperties: false
      required: [changeId, reason, expiresAt]
      properties:
        changeId:
          description: The 16-character id of a change in a report.
          type: string
          pattern: "^[0-9a-f]{16}$"
        reason:
          type: string
          minLength: 10
          maxLength: 500
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    Suppression:
      type: object
      additionalProperties: false
      required: [id, project, changeId, reason, expiresAt, createdAt]
      properties:
        id:
          type: string
          pattern: "^sup_[0-9a-z]{24}$"
        project:
          $ref: "#/components/schemas/Slug"
        changeId:
          type: string
          pattern: "^[0-9a-f]{16}$"
        reason:
          type: string
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, action, actor, target, metadata, createdAt]
      properties:
        id:
          type: string
          pattern: "^aud_[0-9a-z]{24}$"
        action:
          type: string
        actor:
          type: object
          additionalProperties: false
          properties:
            user:
              type: string
            key:
              type: string
        target:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: string
        metadata:
          type: object
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    Trigger:
      type: string
      enum: [ci, manual, app]
    RunStatus:
      type: string
      enum: [uploading, queued, running, complete, failed]
    RunMode:
      description: "`upload`: the report was uploaded. `server`: the platform's worker ran the engine."
      type: string
      enum: [upload, server]
    ArtifactKind:
      type: string
      enum:
        - report-json
        - report-md
        - report-html
        - report-sarif
        - report-junit
        - stage-output
        - input-base
        - input-head
        - input-traffic

    ArtifactIntent:
      type: object
      additionalProperties: false
      required: [kind, sha256, size, contentType]
      properties:
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        sha256:
          $ref: "#/components/schemas/Sha256"
        size:
          type: integer
          minimum: 1
          maximum: 52428800
        contentType:
          type: string
          maxLength: 100

    RunCreate:
      type: object
      additionalProperties: false
      required: [project, trigger, commit, report]
      properties:
        project:
          $ref: "#/components/schemas/Slug"
        trigger:
          $ref: "#/components/schemas/Trigger"
        commit:
          $ref: "#/components/schemas/Sha"
        branch:
          type: string
          maxLength: 255
        pullRequest:
          type: integer
          minimum: 1
        report:
          $ref: "#/components/schemas/DriftReport"
        artifacts:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ArtifactIntent"

    DriftReport:
      type: object
      description: >-
        A drift-report/v1 document. The server validates it against the published JSON Schema
        (packages/report-schema/schemas/drift-report-v1.schema.json); only the fields the API relies on are
        listed here.
      required: [format, gate, summary, semver]
      properties:
        format:
          const: drift-report/v1
        gate:
          $ref: "#/components/schemas/Gate"
        summary:
          $ref: "#/components/schemas/Counts"
        semver:
          $ref: "#/components/schemas/Semver"

    Gate:
      type: object
      required: [passed, failOn]
      properties:
        passed:
          type: boolean
        failOn:
          type: string
          enum: [breaking, risky]
    Counts:
      type: object
      required: [breaking, risky, safe, suppressed]
      properties:
        breaking:
          type: integer
          minimum: 0
        risky:
          type: integer
          minimum: 0
        safe:
          type: integer
          minimum: 0
        suppressed:
          type: integer
          minimum: 0
    Semver:
      type: string
      enum: [major, minor, patch]

    Run:
      type: object
      additionalProperties: false
      required: [id, project, status, mode, trigger, commit, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/RunId"
        project:
          $ref: "#/components/schemas/Slug"
        status:
          $ref: "#/components/schemas/RunStatus"
        mode:
          $ref: "#/components/schemas/RunMode"
        parentRunId:
          description: The run this one re-runs.
          $ref: "#/components/schemas/RunId"
        error:
          description: Why the run failed.
          type: object
          additionalProperties: false
          required: [category, message]
          properties:
            category:
              type: string
            message:
              type: string
        trigger:
          $ref: "#/components/schemas/Trigger"
        commit:
          $ref: "#/components/schemas/Sha"
        branch:
          type: string
        pullRequest:
          type: integer
          minimum: 1
        gate:
          $ref: "#/components/schemas/Gate"
        summary:
          $ref: "#/components/schemas/Counts"
        semver:
          $ref: "#/components/schemas/Semver"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    InputFile:
      description: A file the client uploads, a plain file name (shown in reports), its SHA-256 and size.
      type: object
      additionalProperties: false
      required: [name, sha256, size]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$"
        sha256:
          $ref: "#/components/schemas/Sha256"
        size:
          type: integer
          minimum: 1
          maximum: 20971520
    TrafficFile:
      type: object
      additionalProperties: false
      required: [name, sha256, size, format]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$"
        sha256:
          $ref: "#/components/schemas/Sha256"
        size:
          type: integer
          minimum: 1
          maximum: 268435456
        format:
          type: string
          enum: [jsonl, har]
    FailOn:
      type: string
      enum: [breaking, risky]
    ServerRunCreate:
      type: object
      additionalProperties: false
      required: [commit, base, head]
      properties:
        trigger:
          $ref: "#/components/schemas/Trigger"
        commit:
          $ref: "#/components/schemas/Sha"
        branch:
          type: string
          minLength: 1
          maxLength: 255
        pullRequest:
          type: integer
          minimum: 1
        base:
          $ref: "#/components/schemas/InputFile"
        head:
          $ref: "#/components/schemas/InputFile"
        traffic:
          $ref: "#/components/schemas/TrafficFile"
        policy:
          description: A drift-policy/v1 document (escalations, suppressions with a reason and an expiry, fail-on).
          type: object
        rules:
          description: >-
            A complete drift-rules/v1 ruleset instead of the default one (every change kind needs a rule). With
            the policy and the ruleset the body may be up to 512 KiB.
          type: object
        failOn:
          $ref: "#/components/schemas/FailOn"
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
    RerunCreate:
      description: >-
        What the re-run changes (corpus, policy, rules, fail-on, seed); anything left out stays as it was. A null
        `traffic` removes the traffic.
      type: object
      additionalProperties: false
      properties:
        traffic:
          oneOf:
            - $ref: "#/components/schemas/TrafficFile"
            - type: "null"
        policy:
          type: object
        rules:
          description: >-
            A complete drift-rules/v1 ruleset instead of the default one (every change kind needs a rule). With
            the policy and the ruleset the body may be up to 512 KiB.
          type: object
        failOn:
          $ref: "#/components/schemas/FailOn"
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
    Stage:
      type: object
      additionalProperties: false
      required: [stage, status, cacheHit, attempt]
      properties:
        stage:
          type: string
          enum: [ingest.base, ingest.head, diff, corpus, verify, classify]
        status:
          type: string
          enum: [pending, running, succeeded, failed, skipped]
        cacheHit:
          description: True when the stage's output was reused from the cache instead of computed.
          type: boolean
        attempt:
          type: integer
          minimum: 1
        startedAt:
          $ref: "#/components/schemas/Timestamp"
        finishedAt:
          $ref: "#/components/schemas/Timestamp"

    UploadUrl:
      type: object
      additionalProperties: false
      required: [kind, sha256, url, expiresAt]
      properties:
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        sha256:
          $ref: "#/components/schemas/Sha256"
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    RunCreated:
      type: object
      additionalProperties: false
      required: [run, uploads]
      properties:
        run:
          $ref: "#/components/schemas/Run"
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/UploadUrl"

    RunPage:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        nextCursor:
          type: string

    SignedUrl:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, down]

    Problem:
      type: object
      description: An RFC 9457 problem document.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
