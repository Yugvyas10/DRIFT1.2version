openapi: 3.0.3
info:
  title: Petstore
  version: 2.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PetStatus"
      responses:
        "200":
          description: A page of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getPet
      parameters:
        - name: fields
          in: query
          schema:
            type: string
      responses:
        "200":
          description: One pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Not found
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    PetStatus:
      type: string
      enum: [available, sold, adopted]
    NewPet:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/PetStatus"
        tag:
          type: string
        ownerEmail:
          type: string
          format: email
        category:
          type: string
        note:
          type: string
    Pet:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          $ref: "#/components/schemas/PetStatus"
        tag:
          type: string
security:
  - bearer: []
