openapi: 3.0.3
info: { title: Parameters, version: "2" }
paths:
  /pets:
    get:
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, required: true, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: status, in: header, schema: { type: string } }
        - { name: fields, in: query, deprecated: true, description: Comma-separated fields, schema: { type: string } }
        - { name: tenant, in: query, required: true, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses: { "200": { description: ok } }
