openapi: 3.0.3
info: { title: Enums, version: "2" }
paths:
  /orders:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [new, paid, refunded] }
                channel: { type: string, enum: [web, app] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [open, closed, archived] }
