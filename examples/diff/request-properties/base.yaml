openapi: 3.0.3
info: { title: Request properties, version: "1" }
paths:
  /users:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, nickname]
              properties:
                name: { type: string }
                nickname: { type: string }
                email: { type: string }
                legacyId: { type: string }
                id: { type: string, readOnly: true }
      responses: { "204": { description: ok } }
